  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <circle cx="256" cy="180" r="54" fill="url(#sun)" opacity="0.9" />
  <!-- Rays of the Sun of May -->
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="105" x2="256" y2="85" />
    <line x1="256" y1="255" x2="256" y2="275" />
    <line x1="181" y1="180" x2="161" y2="180" />
    <line x1="331" y1="180" x2="351" y2="180" />
    <line x1="203" y1="127" x2="189" y2="113" />
    <line x1="309" y1="233" x2="323" y2="247" />
    <line x1="203" y1="233" x2="189" y2="247" />
    <line x1="309" y1="127" x2="323" y2="113" />
  </g>
  <!-- Obelisk representation -->
  <polygon points="256,120 220,410 292,410" fill="#f8fafc" opacity="0.95" />
  <polygon points="256,120 256,410 292,410" fill="#cbd5e1" opacity="0.8" />
  <polygon points="256,110 248,135 264,135" fill="#f59e0b" />
